# Required CI gate: `make check` (templ drift in git mode, per-module
# vet/build/test across every Makefile MODULE, the thirty-six layering guards,
# and the compile-only -tags=integration vet of the turso stores and the goredis
# store).
#
# Triggered on every pull_request and on pushes to main only. Branch pushes are
# covered by their PR's run, and tag pushes by the main run of the commit they
# tag. (A push trigger on every branch ran each PR push twice: the push and
# pull_request runs have different refs, so the concurrency group never
# cancelled one for the other.)
#
# The check-run context name this workflow reports is "check" — the job id,
# confirmed via the commit check-runs API (.check_runs[].name) and `gh pr
# checks`. The repository ruleset on `main` must require EXACTLY the literal
# contexts "check" and "vuln" (the two job ids below) — renaming a job (or the
# workflow, if a future rename ever changes the reported context) silently
# un-enforces the gate unless the ruleset is updated in the SAME change. A
# required context that no workflow reports blocks every merge forever.
#
# Hermetic by design: no live creds, no service containers. The store
# conformance suites skip loudly without their datastore env vars, so `make
# check` stays deterministic. Live legs live in live-stores.yml (task-6).
#
# templ comes ONLY from `go tool templ`, pinned via the `tool` directive in
# pockets/cms/views/goth/go.mod (invoked by `make generate` inside `make check`). CI never
# `go install`s templ separately — if it did, the drift gate would compare
# against an unpinned templ and be meaningless.
name: check

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: this gate only reads the tree.
permissions:
  contents: read

# Cancel superseded runs for the same ref (rapid re-pushes to a PR or to main);
# the newest commit's run is the one that matters.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go.work declares `go 1.26.10`; GOTOOLCHAIN stays auto (unset) so the
          # exact toolchain self-downloads if the runner's Go differs.
          go-version-file: go.work
          # Caching is handled below: setup-go's cache is keyed only on go.sum,
          # so its build cache was saved once per dependency change and never
          # refreshed, and every run re-ran every test.
          cache: false
      - id: gopaths
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # Restore the newest main-branch cache (module + build/test cache). Keys
      # are per commit; restore-keys fall back to the latest one, so unchanged
      # packages build and test from cache. A test that opens files is cached
      # by path, size and mtime, and a fresh checkout resets mtimes, so those
      # tests still re-run.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ steps.gopaths.outputs.gocache }}
            ${{ steps.gopaths.outputs.gomodcache }}
          key: check-go-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            check-go-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum') }}-
            check-go-${{ runner.os }}-
      - run: make check
      # Only main saves, so PR runs never evict main's entry from the
      # repository's cache quota; every PR restores from main's latest.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ steps.gopaths.outputs.gocache }}
            ${{ steps.gopaths.outputs.gomodcache }}
          key: check-go-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum') }}-${{ github.sha }}

  # Vulnerability gate (SOC 2 CC7.1 / CC6.8): govulncheck with symbol-level
  # reachability in every Makefile MODULE (`make vuln`). It is its own job, not
  # part of `make check`, because it needs the live vulnerability database from
  # vuln.go.dev and is therefore not hermetic — a newly published advisory turns
  # this red on the next run, which is the point. The ruleset requires it by
  # the literal context "vuln" next to "check".
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: make vuln
