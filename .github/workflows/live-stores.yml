# Live-store conformance — service-container + secret-gated, NEVER a merge
# requirement. Runs the datastore/kv conformance suites against real backends
# that make check (hermetic) only skips: postgres:17 + redis:7 as GitHub Actions
# service containers, and the turso legs against the playground DB via repo
# secrets.
#
# Trigger: manual workflow_dispatch ONLY — no schedule (RULING RH4). The value is
# the button, pressed before cutting a tag or after a store change; a calendar
# run would be needless destructive traffic against the shared playground DB.
#
# Failure-signal ownership (SRE): this workflow is NOT a required check, so no PR
# gate surfaces its result. The explicit alarm is GitHub's workflow-run-failure
# email to the person who pressed the dispatch button — owner jrazmi. Four prior
# milestones closed "live legs not run, no creds"; the button + that email are
# how this one does not. If a run goes dark-red, jrazmi is the one paged.
#
# Turso token (repo secret TURSO_AUTH_TOKEN): owner jrazmi, scoped to the
# gps-impact CMS playground DB; expiry UNKNOWN. Rotation is one action — update
# the repo secret TURSO_AUTH_TOKEN, nothing else in this file changes. The paired
# TURSO_DATABASE_URL secret pins EXACTLY the authorized playground URL (RH3/RH4),
# honoring the standing destructive-run rule — the conformance suites truncate,
# so they may only ever point at that one blessed DB.
#
# Secrets status as of 2026-07-07: TURSO_DATABASE_URL / TURSO_AUTH_TOKEN are
# PENDING UPLOAD (jrazmi uploads them himself). Until then ${{ secrets.* }}
# expands to empty and the three turso `-tags=integration` legs SKIP LOUDLY
# ("TURSO_DATABASE_URL/TURSO_AUTH_TOKEN not set — turso conformance NOT
# verified") — the correct, expected mid-milestone outcome, not a failure.
#
# Firestore live credentials (repo secrets): FIRESTORE_LIVE_PROJECT_ID,
# FIRESTORE_LIVE_CREDENTIALS_B64 (base64 of a service-account key JSON), and the
# optional FIRESTORE_LIVE_DATABASE_PIN / FIRESTORE_LIVE_LOCATION. Owner jrazmi.
# The key belongs to a service account in ONE dedicated test project, scoped to
# Firestore there (the IAM split is in
# integrations/datastores/firestore/README.md) — it is not a project-wide
# credential and must never be reused for anything else. Rotation is three
# actions and touches nothing in this file: mint a new key, `base64 -w0 key.json`
# into the repo secret, delete the superseded key in IAM. Expiry: service-account
# keys DO NOT expire on their own, so rotation is deliberate (owner target: every
# 90 days, and immediately after any run whose logs are suspect). These jobs run
# on GITHUB-HOSTED runners ONLY: the decoded key lives in $RUNNER_TEMP for the
# length of one ephemeral VM and is shredded by an always() step; a self-hosted
# runner would leave it on a machine this workflow does not own.
#
# RECOMMENDED TARGET STATE (owner decision — documented here, deliberately NOT
# implemented): replace the long-lived key with Workload Identity Federation via
# `google-github-actions/auth@v2` (`permissions: id-token: write` + a workload
# identity pool trusting this repository). That mints a short-lived credential
# per run and removes the secret — and with it the rotation duty and the
# base64-decode step — entirely. Until that pool exists, the key secret stands.
#
# Secrets status as of 2026-09-09: FIRESTORE_LIVE_PROJECT_ID,
# FIRESTORE_LIVE_CREDENTIALS_B64, FIRESTORE_LIVE_DATABASE_PIN and
# FIRESTORE_LIVE_LOCATION DO NOT EXIST YET — no GCP project has been
# provisioned for this repo. Until they do, the firestore-live job SKIPS LOUDLY
# ("no live Firestore configuration — live Firestore behavior NOT verified") and
# the firestore-emulator job carries the whole Firestore signal. That emulator
# signal is NOT release evidence: the emulator enforces no composite indexes,
# keeps no index registry (ProbeIndexes refuses against it), and cannot produce
# commit-contention exhaustion. The firestore-stores milestone's release gate is
# a required live run (workflow_dispatch input firestore_live_required: true,
# which sets FIRESTORE_LIVE_REQUIRED=1 and turns every skip into a failure).
#
# The Firestore emulator is started as a BACKGROUND DOCKER STEP, not a service
# container: a service container cannot override the image's command, and
# gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators needs
# `gcloud emulators firestore start …` as its command.
#
# NOT testcontainers (that harness is workshop-v2 scope): the services here are
# workflow infrastructure; the Go tests stay env-gated exactly as written. gcs /
# s3 / sendgrid have no legs here (no CI creds; out of scope).
#
# DSN-host consistency: these jobs run directly on the runner, NOT inside a
# container, so each service's port is published to the runner's localhost —
# every DSN/addr below uses localhost:<published-port>.
name: live-stores

on:
  workflow_dispatch:
    inputs:
      firestore_live_required:
        description: >-
          Release verification: fail (instead of skipping) when the live
          Firestore configuration is missing or any required live test skips.
        type: boolean
        default: false

# Least-privilege: these jobs only read the tree and talk to their own services.
permissions:
  contents: read

env:
  GOCACHE: /tmp/gopernicus-audit-s1.aMLwCQ/cache

jobs:
  # Job A — postgres pgx store conformance (cms/auth/jobs) + turso store
  # conformance (cms/auth/jobs), driven through `make test-stores`.
  postgres-turso:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        # Published to the runner's localhost:5432 (job runs on the runner).
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Same toolchain/caching posture as check.yml: go.work declares
          # `go 1.26.1`, GOTOOLCHAIN stays auto, cache keyed off every go.sum.
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"
      - name: make test-stores (pgx live + turso -tags=integration)
        env:
          # pgx legs (cms/auth/jobs) connect here; matches the canonical
          # local-dev DSN. postgres:17 defaults db=postgres user=postgres.
          POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          # Turso legs. Secrets PENDING UPLOAD (2026-07-07) ⇒ empty ⇒ the three
          # turso legs skip loudly, which is correct until jrazmi uploads them.
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: make test-stores

  # Job B — goredis conformance (-race) against redis, plus pgxdb's env-gated
  # live tests against postgres (migrate round-trip, List behavior, and the
  # ratelimiter.Limiter legs). goredis is NOT in STORE_MODULES /
  # `make test-stores`, and the redis service alone gates nothing (the suites key
  # off REDIS_TEST_ADDR), so this is a separate job by necessity.
  redis-pgxdb:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        # Published to the runner's localhost:6379.
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        # Published to the runner's localhost:5432.
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"
      - name: goredis conformance (-race) against redis
        working-directory: integrations/kvstores/goredis
        env:
          # goredis conformance keys off this var; unset ⇒ loud skip.
          REDIS_TEST_ADDR: localhost:6379
        run: go test -race ./...
      - name: pgxdb live tests (-race) against postgres
        working-directory: integrations/datastores/pgxdb
        env:
          # pgxdb's live tests gate on this var; unset ⇒ loud skip.
          #
          # DESTRUCTIVE: point this ONLY at a throwaway/dedicated database. The
          # limiter legs CREATE TABLE ratelimit_windows (plus an error-mapping
          # schema they drop) and run an unqualified
          # `DELETE FROM ratelimit_windows` for the pruning proof. The service
          # container above is exactly that: created and destroyed per run.
          #
          # -race is Go-level hygiene here — it catches data races in the test's
          # own 40 goroutines, and proves NOTHING about database atomicity. The
          # atomicity proof is the live exact-K assertion itself: 40 concurrent
          # callers at a ceiling of 8 must yield exactly 8 admissions.
          POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race ./...

  # Job C — the Firestore emulator suites: the CONNECTOR
  # (integrations/datastores/firestore) and every pocket store train built on it
  # (pockets/authorization/stores/firestore, pockets/authentication/stores/firestore),
  # all -tags=integration. The connector is in MODULES and the stores in
  # STORE_MODULES, so `make test-stores` reaches them, but this job runs the
  # modules directly — the postgres/turso legs have no business gating the
  # Firestore ones.
  #
  # Each module opens its OWN emulator database (the connector its default one,
  # the authorization store "authorization", the authentication store
  # "authentication"): firestoretest.Reset clears a WHOLE database, so two suites
  # sharing one would delete each other's rows and the failure would arrive as a
  # flake.
  #
  # The emulator is a background docker step (see the header) with a readiness
  # wait against its HTTP root; the tests themselves skip loudly if
  # FIRESTORE_EMULATOR_HOST is unset, so a failed start cannot pass as a green.
  firestore-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"
      - name: verify the Firestore workflow helpers
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_firestore_*.py'
      - name: start the Firestore emulator
        run: |
          # DIGEST-PINNED to the image C0 measured. A floating :emulators tag
          # would swap the emulator under this suite between two dispatches, and
          # the emulator's transaction/lock behavior is exactly what C3 measured.
          # To bump: pull the tag, read the digest
          # (`docker inspect --format '{{index .RepoDigests 0}}' <image>`),
          # replace it below, and RE-RUN C3's contention and lock-timing
          # measurements in the same change — they are properties of the
          # emulator build, not of this repository. The Makefile and module
          # README keep the floating tag for local runs on purpose: those are
          # developer convenience, not a gate.
          docker run -d --name firestore-emulator -p 8080:8080 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators@sha256:45a15cc163d2df13137478856b4b9bb90426100fa8aec542269460c10110b727 \
            gcloud emulators firestore start --host-port=0.0.0.0:8080 --project=gopernicus-test
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then
              echo "emulator ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: the Firestore emulator did not answer on 127.0.0.1:8080 within 60s"
          docker logs firestore-emulator || true
          exit 1
      - name: firestore connector emulator suite (-tags=integration)
        working-directory: integrations/datastores/firestore
        env:
          # Unset ⇒ every emulator case skips loudly. Set here on purpose: this
          # job exists to make them RUN.
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIRESTORE_PROJECT_ID: gopernicus-test
        run: go test -tags=integration -count=1 -timeout 15m ./...
      # 30 minutes, not the connector's 15: the shared authorization conformance
      # suite runs ~130 fixtures, several of them concurrent transaction specs,
      # and the emulator holds a contended lock for up to thirty seconds. The
      # Makefile's test-stores leg carries the same timeout for the same reason.
      - name: authorization firestore store emulator suite (-tags=integration)
        working-directory: pockets/authorization/stores/firestore
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIRESTORE_PROJECT_ID: gopernicus-test
        run: go test -tags=integration -count=1 -timeout 30m ./...
      # Authentication includes atomic proof consumption and revocation races;
      # allow time for the emulator's contended transaction locks to settle.
      - name: authentication firestore store emulator suite (-tags=integration)
        working-directory: pockets/authentication/stores/firestore
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIRESTORE_PROJECT_ID: gopernicus-test
        run: go test -tags=integration -count=1 -timeout 45m ./...
      - name: stop the Firestore emulator
        if: always()
        run: docker rm -f firestore-emulator || true

  # Job D — the OPTIONAL live-project leg (-tags='integration,live', Test*Live).
  # It is the only thing that proves what the emulator cannot: the shipped index
  # manifests deployed WHOLE — composite indexes actually resolving AND the
  # single-field configuration each manifest's fieldOverrides declare — the Admin
  # API index probe's verdict against a real index registry, production read-only
  # snapshot isolation, and commit-contention exhaustion → sdk.ErrConflict.
  #
  # Configuration (repo secrets, NONE of which exist yet — see the header):
  #   FIRESTORE_LIVE_PROJECT_ID        the DEDICATED test project. Gate: empty ⇒ skip.
  #                                    A project id is NOT a credential; it can equally be
  #                                    a repo `vars.` entry. Owner call — both options are
  #                                    written up in the module README's first-dispatch
  #                                    checklist; switching means editing ONE line here.
  #   FIRESTORE_LIVE_CREDENTIALS_B64   base64 of a service-account key JSON. Mapped ONLY on
  #                                    the step that writes it (never job-level env), decoded
  #                                    to a file, exported as GOOGLE_APPLICATION_CREDENTIALS,
  #                                    and shredded by an always() step. Gate: empty ⇒ skip.
  #   FIRESTORE_LIVE_DATABASE_PIN      OPTIONAL, non-release checks only. Set ⇒ use that database and
  #                                    never create or delete one. Empty ⇒ this job provisions
  #                                    a unique ci-<run>-<attempt>-<suffix> database and deletes ONLY that
  #                                    one in cleanup (C-D8). Deliberately NOT named
  #                                    FIRESTORE_LIVE_DATABASE_ID: that name is the RESOLVED
  #                                    id this job exports to $GITHUB_ENV for the tests, and a
  #                                    job-level secret of the same name would collide with it
  #                                    (a job-level env value WINS over $GITHUB_ENV, so the
  #                                    provisioned id would never reach the tests).
  #   FIRESTORE_LIVE_LOCATION          OPTIONAL, default nam5. Only used when provisioning.
  #
  # IAM on that service account, project-scoped to the test project:
  # roles/datastore.owner — or roles/datastore.user + roles/datastore.indexAdmin
  # plus datastore.databases.create/delete, which today only datastore.owner
  # bundles. See integrations/datastores/firestore/README.md.
  #
  # Secrets are mapped to job-level env because the secrets context is not
  # available in step `if:` conditions; every step therefore gates on env. The
  # credential is the exception — it is mapped at step level, and the gate below
  # tests only WHETHER it is set, through an expression that never puts the value
  # in the environment.
  #
  # Live configuration remains pending as of 2026-09-11. Local helper checks
  # and emulator runs do not prove this job against GCP. Release evidence needs
  # firestore_live_required: true plus the archived run ID and evidence artifact.
  firestore-live:
    runs-on: ubuntu-latest
    # The budget, itemized, because "90" was written when this job ran ONE
    # 30-minute suite and no longer covers what runs here:
    #
    #   provisioning + checkout + setup-go             ~5 min
    #   composite index deploy, waited to READY        up to 20 min (loop below)
    #   single-field configuration deploy, settled     up to 10 min (loop below)
    #   connector live suite (its own -timeout 30m)    up to 30 min
    #   authorization store live suite (-timeout 30m)  up to 30 min
    #   authentication store live suite (-timeout 45m) up to 45 min
    #                                                  -----------------------
    #                                                  up to 140 min
    #
    # The three go-test steps DO NOT share a budget: each carries its own
    # -timeout and they run in sequence, so this ceiling has to cover their sum
    # PLUS both deploy waits. 150 is that sum with a small margin — the point at
    # which something is wrong and the run should be killed with its cleanup step
    # still reachable, rather than burning the 6-hour default. A ceiling below
    # the sum is worse than none: it kills a healthy long run in the middle of
    # the last suite and reports it as a live-store failure.
    timeout-minutes: 150
    # One live run at a time, repo-wide: two concurrent dispatches would race for
    # index quota in the shared test project and (with FIRESTORE_LIVE_DATABASE_PIN
    # set) for the same database's documents. cancel-in-progress is FALSE on
    # purpose — cancelling a run mid-flight can strand the ci-<run id> database it
    # created; the queued run waits instead.
    concurrency:
      group: firestore-live
      cancel-in-progress: false
    env:
      FIRESTORE_LIVE_PROJECT_ID: ${{ secrets.FIRESTORE_LIVE_PROJECT_ID }}
      FIRESTORE_LIVE_DATABASE_PIN: ${{ secrets.FIRESTORE_LIVE_DATABASE_PIN }}
      FIRESTORE_LIVE_LOCATION: ${{ secrets.FIRESTORE_LIVE_LOCATION }}
      # The release gate. "1" turns a missing configuration or a skipped
      # required case into a failure, in the tests AND in the audit step.
      FIRESTORE_LIVE_REQUIRED: ${{ inputs.firestore_live_required && '1' || '' }}
      # The index manifests to deploy on this run's database, SPACE-SEPARATED,
      # repo-relative — one per store module whose live suite runs below (the
      # connector ships none of its own; its four fixtures' indexes are created
      # explicitly). A store train appends its manifest here in the same change
      # that adds its live step, because a store whose composites were never
      # deployed fails live as FAILED_PRECONDITION that reads like a store bug.
      FIRESTORE_LIVE_INDEXES: >-
        pockets/authorization/stores/firestore/firestore.indexes.json
        pockets/authorization/stores/firestore/firestore.audit.indexes.json
        pockets/authentication/stores/firestore/firestore.indexes.json
      # Force-unset. Nothing else in this job writes FIRESTORE_EMULATOR_HOST —
      # this line exists so that a value inherited from anywhere (a future
      # repo-level env, a runner image default) cannot point the "live" leg at an
      # emulator. firestoretest.OpenLive refuses outright when it is non-empty;
      # this is the belt to that suspender.
      FIRESTORE_EMULATOR_HOST: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # The gate, stated once. Everything after it is conditioned on
      # LIVE_CONFIGURED, so an unconfigured dispatch reports one loud line
      # instead of a wall of red — unless this is a release verification, where
      # missing configuration IS the failure.
      - name: check the live Firestore configuration
        env:
          # Presence, not value: the expression is evaluated by the runner and
          # only ever expands to "1" or "", so the key never enters this step's
          # environment or its logs.
          HAVE_CREDENTIALS: ${{ secrets.FIRESTORE_LIVE_CREDENTIALS_B64 != '' && '1' || '' }}
        run: |
          if [ "$FIRESTORE_LIVE_REQUIRED" = "1" ] && [ -n "$FIRESTORE_LIVE_DATABASE_PIN" ]; then
            echo "ERROR: release verification requires a disposable run-owned database; unset FIRESTORE_LIVE_DATABASE_PIN"
            exit 1
          fi
          if [ -n "$FIRESTORE_LIVE_PROJECT_ID" ] && [ -n "$HAVE_CREDENTIALS" ]; then
            echo "LIVE_CONFIGURED=1" >> "$GITHUB_ENV"
            echo "live Firestore configuration present (project $FIRESTORE_LIVE_PROJECT_ID)"
            exit 0
          fi
          if [ "$FIRESTORE_LIVE_REQUIRED" = "1" ]; then
            echo "ERROR: firestore_live_required was requested but FIRESTORE_LIVE_PROJECT_ID / FIRESTORE_LIVE_CREDENTIALS_B64 are not set — live Firestore behavior CANNOT be verified"
            exit 1
          fi
          echo "SKIPPING: no live Firestore configuration — live Firestore behavior NOT verified"

      # gcloud is preinstalled on GitHub-hosted ubuntu-latest, but "preinstalled"
      # is an assumption this job's whole database lifecycle rests on, so it is
      # asserted once, loudly, before anything is created.
      - name: check that gcloud is available
        if: env.LIVE_CONFIGURED == '1'
        run: |
          if ! command -v gcloud >/dev/null 2>&1; then
            echo "ERROR: gcloud is not on PATH — this runner cannot provision, index, or clean up a Firestore database. Add google-github-actions/setup-gcloud, or use a runner image that ships the Cloud SDK."
            exit 1
          fi
          gcloud --version

      - name: write the service-account credentials
        if: env.LIVE_CONFIGURED == '1'
        env:
          # Step-level ONLY, and base64 so the value cannot be line-split or
          # mangled by shell quoting on its way to the file.
          FIRESTORE_LIVE_CREDENTIALS_B64: ${{ secrets.FIRESTORE_LIVE_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/firestore-sa.json"
          umask 077
          if ! printf '%s' "$FIRESTORE_LIVE_CREDENTIALS_B64" | base64 -d > "$key"; then
            echo "ERROR: FIRESTORE_LIVE_CREDENTIALS_B64 is not valid base64 — store the key as \`base64 -w0 key.json\`"
            exit 1
          fi
          chmod 600 "$key"
          if ! head -c 1 "$key" | grep -q '{'; then
            echo "ERROR: the decoded credential is not JSON — the secret holds base64 of something else"
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key" >> "$GITHUB_ENV"
          gcloud auth activate-service-account --key-file="$key"

      # C-D8: a DISPOSABLE, run-owned database per run — never "(default)",
      # never a shared one — unless the operator pinned a pre-provisioned
      # database with FIRESTORE_LIVE_DATABASE_PIN. Both branches export the
      # RESOLVED id as FIRESTORE_LIVE_DATABASE_ID, which is what the tests and
      # every gcloud call below read. FIRESTORE_LIVE_OWNED records that this run
      # successfully created the database, so cleanup can only delete what it made.
      - name: provision a disposable Firestore database
        if: env.LIVE_CONFIGURED == '1'
        run: |
          set -euo pipefail
          # A PINNED database ACCUMULATES index state that nothing here ever
          # prunes. The deploy step only creates and patches: a composite a
          # manifest USED to declare stays READY forever, and a field exemption a
          # manifest USED to declare stays applied, both counting against the
          # per-database caps (200 composite indexes and 200 single-field
          # configurations without billing enabled — the latter shared with TTL
          # policies). A run-owned ci-<run id> database has no such drift because
          # it is deleted at the end. The pinned one needs a periodic sweep,
          # BY HAND, against a checkout's manifests:
          #
          #   gcloud firestore indexes composite list --database="$FIRESTORE_LIVE_DATABASE_PIN" \
          #     --project="$FIRESTORE_LIVE_PROJECT_ID" --format=json
          #   gcloud firestore indexes composite delete <index id> --database="$FIRESTORE_LIVE_DATABASE_PIN" \
          #     --project="$FIRESTORE_LIVE_PROJECT_ID"
          #   gcloud firestore indexes fields list --database="$FIRESTORE_LIVE_DATABASE_PIN" \
          #     --project="$FIRESTORE_LIVE_PROJECT_ID" --format=json
          #   gcloud firestore indexes fields update <fieldPath> --collection-group=<cg> \
          #     --database="$FIRESTORE_LIVE_DATABASE_PIN" --project="$FIRESTORE_LIVE_PROJECT_ID" --clear-exemption
          #
          # It is deliberately NOT automated: a delete loop driven by "not in
          # today's manifest" would wipe another pocket's or the host's indexes
          # off a shared database on the first run of a branch that dropped one.
          if [ "$FIRESTORE_LIVE_DATABASE_PIN" = "(default)" ]; then
            echo "ERROR: live tests and index deployment refuse the default database"
            exit 1
          fi
          if [ -n "$FIRESTORE_LIVE_DATABASE_PIN" ]; then
            echo "FIRESTORE_LIVE_DATABASE_ID=$FIRESTORE_LIVE_DATABASE_PIN" >> "$GITHUB_ENV"
            echo "using the pre-provisioned database $FIRESTORE_LIVE_DATABASE_PIN — this run will NOT create or delete a database, and stale indexes/field exemptions from earlier runs are NOT pruned (see the comment above and the store READMEs)"
            exit 0
          fi
          # A rerun gets a new ID. Never claim a preexisting database when a
          # create fails: cleanup is permitted only after successful creation.
          suffix=$(python3 -c 'import uuid; print(uuid.uuid4().hex[:12])')
          database="ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$suffix"
          echo "FIRESTORE_LIVE_DATABASE_CANDIDATE=$database" >> "$GITHUB_ENV"
          if ! gcloud firestore databases create \
              --database="$database" \
              --location="${FIRESTORE_LIVE_LOCATION:-nam5}" \
              --type=firestore-native \
              --project="$FIRESTORE_LIVE_PROJECT_ID"; then
            echo "ERROR: creation was not confirmed for $database; ownership was NOT recorded. Inspect this candidate manually if the operation may have reached GCP."
            exit 1
          fi
          echo "FIRESTORE_LIVE_OWNED=$database" >> "$GITHUB_ENV"
          echo "FIRESTORE_LIVE_DATABASE_ID=$database" >> "$GITHUB_ENV"
          echo "created the run-owned database $database"

      # Indexes AND single-field configuration — the two things the emulator
      # cannot verify at all, which is the whole premise of this job.
      #
      # The connector ships NO index manifest of its own (each store module
      # embeds one and exports it), so this step collects three sets:
      #
      #   1. the four composite indexes the connector's own live leg needs on
      #      firestore_c4_list_live — both directions of both order fields,
      #      because the reverse HasPrev probe flips every direction and a
      #      composite index is direction-specific;
      #   2. every composite a store train exported — FIRESTORE_LIVE_INDEXES is a
      #      SPACE-SEPARATED LIST of repo-relative paths, because one run's
      #      database serves every store module's live leg and each module embeds
      #      its own manifest. That is a jq loop over each manifest's `.indexes`
      #      into `gcloud firestore indexes composite create` — NOT
      #      `firebase deploy`, which needs the Firebase CLI (absent on
      #      ubuntu-latest) and a firebase.json this repo does not have. jq IS
      #      preinstalled. Empty/unset ⇒ skipped with a notice;
      #   3. every manifest's `.fieldOverrides`, into
      #      `gcloud firestore indexes fields update`. A field override is not
      #      decoration: it REPLACES that field's default single-field index set,
      #      and the stores' boot probe CHECKS every declared override
      #      (ProbeIndexes issues one GetField per override with a non-empty
      #      index list). A run that deployed only the composites would fail the
      #      probe at CONSTRUCTION on a field the manifest declares and the
      #      database never got — which reads like a store bug and is really an
      #      undeployed half of the manifest. With this step, the live leg proves
      #      the manifest as a WHOLE: composites AND field configuration.
      #
      # All three sets are deduplicated before deployment. Polling then matches
      # each requested composite identity and exact field configuration, so an
      # unrelated READY index or an outdated exemption cannot satisfy the gate.
      #
      # ALREADY_EXISTS is the one benign composite failure (a pinned database
      # keeps its indexes between runs); anything else fails the step with
      # gcloud's stderr, because a silently uncreated index becomes a
      # FAILED_PRECONDITION that reads like a connector bug. A field update needs
      # no such branch: it PATCHES the field's index configuration, so
      # re-applying a configuration a pinned database already carries succeeds.
      #
      # Both creates pass --async (the flag is on BOTH commands — verified
      # against gcloud 557.0.0 `--help` and the reference pages
      # cloud.google.com/sdk/gcloud/reference/firestore/indexes/composite/create
      # and .../firestore/indexes/fields/update). Without it every call blocks on
      # its own long-running operation and many indexes serialize into hours of
      # waiting for states the loops below read anyway. Those loops are the
      # SINGLE source of readiness, and there are two of them because one does
      # not cover the other:
      #
      #   - composites: every requested identity must be READY; CREATING stays
      #     pending and NEEDS_REPAIR fails immediately;
      #   - field configuration: a field update is a long-running operation too,
      #     and `indexes composite list` NEVER returns single-field indexes. It
      #     is waited separately with `indexes fields list`, whose Field resource
      #     carries exactly the state needed — indexConfig.usesAncestorConfig
      #     (false once the exemption is applied), indexConfig.reverting, and a
      #     per-index `state` that reads CREATING while the single-field index
      #     builds (cloud.google.com/firestore/docs/reference/rest/v1/
      #     projects.databases.collectionGroups.fields).
      #
      # --query-scope is omitted for the connector's four composites: the flag's
      # default IS `collection` and its values are lowercase (verified at C8
      # against gcloud 557.0.0 --help and the composite/create reference page).
      # The composite manifest loop emits it only for a non-COLLECTION scope. The
      # FIELD loop cannot emit it at all: `indexes fields update --index` accepts
      # ONLY the keys `order` and `array-config` — there is no query-scope key on
      # that flag — so a fieldOverride asking for a COLLECTION_GROUP-scoped
      # single-field index is refused loudly here rather than deployed as
      # something narrower than the manifest says.
      - name: deploy the index manifests (composites + field configuration) and wait
        if: env.LIVE_CONFIGURED == '1'
        run: |
          set -euo pipefail
          indexes_json="$RUNNER_TEMP/firestore-indexes.json"
          fields_json="$RUNNER_TEMP/firestore-fields.json"
          composite_args="$RUNNER_TEMP/firestore-composite-args.tsv"
          field_args="$RUNNER_TEMP/firestore-field-args.tsv"
          : > "$composite_args"
          : > "$field_args"

          create_index() {
            group="$1"; shift
            if out=$(gcloud firestore indexes composite create \
                --collection-group="$group" \
                --database="$FIRESTORE_LIVE_DATABASE_ID" \
                --project="$FIRESTORE_LIVE_PROJECT_ID" \
                --async \
                "$@" 2>&1); then
              echo "  created  $group  $*"
              return 0
            fi
            if printf '%s' "$out" | grep -Eqi 'already exists|ALREADY_EXISTS'; then
              echo "  exists   $group  $*"
              return 0
            fi
            echo "ERROR: creating the composite index on $group failed: $*"
            printf '%s\n' "$out"
            return 1
          }

          update_field() {
            group="$1"; field="$2"; shift 2
            if out=$(gcloud firestore indexes fields update "$field" \
                --collection-group="$group" \
                --database="$FIRESTORE_LIVE_DATABASE_ID" \
                --project="$FIRESTORE_LIVE_PROJECT_ID" \
                --async \
                "$@" 2>&1); then
              echo "  configured  $group.$field  $*"
              return 0
            fi
            echo "ERROR: configuring the single-field indexes of $group.$field failed: $*"
            printf '%s\n' "$out"
            return 1
          }

          # 1. The connector's own live fixtures (C4), into the SAME arg file as
          #    the manifests so the sort -u below dedupes across all of them.
          for direction in ascending descending; do
            for field in created_at n; do
              printf 'firestore_c4_list_live\t--field-config=field-path=group,order=ascending\t--field-config=field-path=%s,order=%s\t--field-config=field-path=id,order=%s\n' \
                "$field" "$direction" "$direction" >> "$composite_args"
            done
          done

          # 2 and 3. Every exported manifest's composites and field overrides.
          if [ -n "${FIRESTORE_LIVE_INDEXES:-}" ]; then
            # Unquoted on purpose: the value is a space-separated LIST of
            # manifests, one per store module with a live leg in this job.
            for manifest in $FIRESTORE_LIVE_INDEXES; do
              if [ ! -f "$manifest" ]; then
                echo "ERROR: FIRESTORE_LIVE_INDEXES names $manifest, which this checkout does not have — a store train set it to a path that moved or was never committed"
                exit 1
              fi
              echo "collecting the exported index manifest $manifest"
              jq -r '
                (.indexes // [])[]
                | [ .collectionGroup ]
                  + (if ((.queryScope // "COLLECTION") == "COLLECTION") then []
                     else [ "--query-scope=" + (.queryScope | ascii_downcase | gsub("_"; "-")) ] end)
                  + ( (.fields // []) | map(
                        if .order then "--field-config=field-path=" + .fieldPath + ",order=" + (.order | ascii_downcase)
                        elif .arrayConfig then "--field-config=field-path=" + .fieldPath + ",array-config=" + (.arrayConfig | ascii_downcase)
                        else "UNSUPPORTED-INDEX:" + (. | tojson) end ) )
                | @tsv
              ' "$manifest" >> "$composite_args"
              jq -r '
                (.fieldOverrides // [])[]
                | [ .collectionGroup, .fieldPath ]
                  + ( if ((.ttl // false) == true) then
                        [ "UNSUPPORTED-INDEX:a ttl policy — this step deploys index configuration only; a TTL is a different command (gcloud firestore fields ttls update)" ]
                      elif (has("indexes") | not) then
                        [ "UNSUPPORTED-INDEX:no \"indexes\" key — an override that names no index list is ambiguous, and guessing would DISABLE the field entirely" ]
                      elif ((.indexes | length) == 0) then
                        [ "--disable-indexes" ]
                      else ( .indexes | map(
                          if ((.queryScope // "COLLECTION") != "COLLECTION") then "UNSUPPORTED-INDEX:" + (. | tojson)
                          elif .order then "--index=order=" + (.order | ascii_downcase)
                          elif .arrayConfig then "--index=array-config=" + (.arrayConfig | ascii_downcase)
                          else "UNSUPPORTED-INDEX:" + (. | tojson) end ) )
                      end )
                | @tsv
              ' "$manifest" >> "$field_args"
            done
          else
            echo "no exported index manifest configured (the connector ships none; each store train APPENDS its exported manifest to FIRESTORE_LIVE_INDEXES)"
          fi

          if grep -q 'UNSUPPORTED-INDEX:' "$composite_args" "$field_args"; then
            echo "ERROR: a manifest declares index configuration this step cannot express as a gcloud flag (vector-config, search-config, a non-COLLECTION single-field scope, or a TTL)"
            grep -h 'UNSUPPORTED-INDEX:' "$composite_args" "$field_args"
            exit 1
          fi

          # Deduplicate equivalent deployment commands across the manifests.
          # Readiness below matches each exact requested identity and mode;
          # unrelated indexes in a pinned database cannot satisfy this run.
          LC_ALL=C sort -u "$composite_args" -o "$composite_args"
          LC_ALL=C sort -u "$field_args" -o "$field_args"

          # `fields update --index` OVERWRITES a field's index list and DELETES
          # any index it omits, so two manifests asking for DIFFERENT sets on the
          # same field is not a merge — it is whichever ran last silently
          # winning. sort -u keeps both lines; this refuses the pair outright.
          conflicts=$(cut -f1,2 "$field_args" | LC_ALL=C sort | uniq -d)
          if [ -n "$conflicts" ]; then
            echo "ERROR: two manifests declare DIFFERENT single-field index sets for the same collection group and field path. That flag overwrites rather than merges, so deploying both would silently delete one manifest's indexes:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

          expected=$(wc -l < "$composite_args" | tr -d ' ')
          echo "deploying $expected distinct composite index(es)"
          while IFS=$'\t' read -r -a spec; do
            [ "${#spec[@]}" -gt 0 ] || continue
            create_index "${spec[@]}"
          done < "$composite_args"

          field_total=$(wc -l < "$field_args" | tr -d ' ')
          echo "deploying $field_total distinct single-field configuration(s)"
          while IFS=$'\t' read -r -a spec; do
            [ "${#spec[@]}" -gt 0 ] || continue
            update_field "${spec[@]}"
          done < "$field_args"

          echo "waiting for $expected expected composite index(es) to report READY"
          composites_ready=""
          for i in $(seq 1 60); do
            gcloud firestore indexes composite list \
              --database="$FIRESTORE_LIVE_DATABASE_ID" \
              --project="$FIRESTORE_LIVE_PROJECT_ID" \
              --format=json > "$indexes_json"
            if python3 .github/scripts/firestore_index_readiness.py composites "$composite_args" "$indexes_json"; then
              echo "every expected composite index is READY"
              composites_ready=1
              break
            else
              status=$?
              [ "$status" -ne 2 ] || exit "$status"
            fi
            sleep 20
          done
          if [ -z "$composites_ready" ]; then
            echo "ERROR: after 20 minutes the requested composite indexes are not all READY"
            jq -r '.[] | "  " + .name + "  " + .state' "$indexes_json" || true
            exit 1
          fi

          if [ "$field_total" -eq 0 ]; then
            echo "no manifest declares a field override — nothing further to wait for"
            echo "FIRESTORE_INDEXES_READY=1" >> "$GITHUB_ENV"
            exit 0
          fi

          # The SECOND wait. The loop above cannot stand in for it: `indexes
          # composite list` never returns single-field indexes, so a field whose
          # exemption is still being applied is invisible there and would fail
          # the store's boot probe (or a query) minutes later, on a run that
          # reported its indexes READY.
          echo "waiting for $field_total single-field configuration(s) to settle"
          fields_ready=""
          for i in $(seq 1 30); do
            gcloud firestore indexes fields list \
              --database="$FIRESTORE_LIVE_DATABASE_ID" \
              --project="$FIRESTORE_LIVE_PROJECT_ID" \
              --format=json > "$fields_json"
            if python3 .github/scripts/firestore_index_readiness.py fields "$field_args" "$fields_json"; then
              echo "every declared field override matches its requested READY configuration"
              fields_ready=1
              break
            else
              status=$?
              [ "$status" -ne 2 ] || exit "$status"
            fi
            sleep 20
          done
          if [ -z "$fields_ready" ]; then
            echo "ERROR: after 10 minutes the requested single-field configurations are not all READY"
            exit 1
          fi
          echo "FIRESTORE_INDEXES_READY=1" >> "$GITHUB_ENV"

      # Live roots come from Go's selected test files, with package identity.
      # Required audits reject both root and nested skips, absent/unfinished
      # tests, and nonzero go-test exits. Only the named ambient family may skip.
      - name: connector live suite (-tags='integration,live')
        if: ${{ !cancelled() && env.LIVE_CONFIGURED == '1' && env.FIRESTORE_INDEXES_READY == '1' }}
        working-directory: integrations/datastores/firestore
        run: |
          set +e
          go test -json -count=1 -tags='integration,live' -timeout 30m -run 'Live$' ./... \
            > "$RUNNER_TEMP/firestore-live.json"
          status=$?
          set -e
          echo "go test exit status: $status"
          echo "FIRESTORE_LIVE_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: audit the connector live tests and skips
        if: ${{ !cancelled() && env.LIVE_CONFIGURED == '1' && env.FIRESTORE_INDEXES_READY == '1' }}
        working-directory: integrations/datastores/firestore
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/firestore_live_audit.py" \
            --prefix "$RUNNER_TEMP/firestore-live" \
            --minimum 11 --status "${FIRESTORE_LIVE_STATUS:-1}"

      - name: authorization store live suite (-tags='integration,live')
        if: ${{ !cancelled() && env.LIVE_CONFIGURED == '1' && env.FIRESTORE_INDEXES_READY == '1' }}
        working-directory: pockets/authorization/stores/firestore
        run: |
          set +e
          go test -json -count=1 -tags='integration,live' -timeout 30m -run 'Live$' ./... \
            > "$RUNNER_TEMP/firestore-authorization-live.json"
          status=$?
          set -e
          echo "go test exit status: $status"
          echo "FIRESTORE_AUTHORIZATION_LIVE_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: audit the authorization store live tests and skips
        if: ${{ !cancelled() && env.LIVE_CONFIGURED == '1' && env.FIRESTORE_INDEXES_READY == '1' }}
        working-directory: pockets/authorization/stores/firestore
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/firestore_live_audit.py" \
            --prefix "$RUNNER_TEMP/firestore-authorization-live" \
            --minimum 10 --status "${FIRESTORE_AUTHORIZATION_LIVE_STATUS:-1}" \
            --allow-skip TestRunTransactionalLive

      - name: authentication store live suite (-tags='integration,live')
        if: ${{ !cancelled() && env.LIVE_CONFIGURED == '1' && env.FIRESTORE_INDEXES_READY == '1' }}
        working-directory: pockets/authentication/stores/firestore
        run: |
          set +e
          go test -json -count=1 -tags='integration,live' -timeout 45m -run 'Live$' ./... \
            > "$RUNNER_TEMP/firestore-authentication-live.json"
          status=$?
          set -e
          echo "go test exit status: $status"
          echo "FIRESTORE_AUTHENTICATION_LIVE_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: audit the authentication store live tests and skips
        if: ${{ !cancelled() && env.LIVE_CONFIGURED == '1' && env.FIRESTORE_INDEXES_READY == '1' }}
        working-directory: pockets/authentication/stores/firestore
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/firestore_live_audit.py" \
            --prefix "$RUNNER_TEMP/firestore-authentication-live" \
            --minimum 4 --status "${FIRESTORE_AUTHENTICATION_LIVE_STATUS:-1}"

      # The release evidence. RELEASING.md's firestore gate cites THIS artifact
      # by run id instead of a count pasted into a document by hand: the JSON the
      # audit read, the roots it derived, the table it printed, and the index
      # states the suite ran against. always() so a FAILED live run is just as
      # archived as a green one.
      #
      # retention-days is the maximum a repository may request; GitHub silently
      # clamps it to the repo/org limit (90 days on public repos), so this asks
      # for the longest the settings allow rather than a number that must be
      # kept in sync with them.
      - name: upload the live-run evidence
        if: always() && env.LIVE_CONFIGURED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: firestore-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/firestore-live.json
            ${{ runner.temp }}/firestore-live-expected.txt
            ${{ runner.temp }}/firestore-live-allowed.txt
            ${{ runner.temp }}/firestore-live-audit.txt
            ${{ runner.temp }}/firestore-authorization-live.json
            ${{ runner.temp }}/firestore-authorization-live-expected.txt
            ${{ runner.temp }}/firestore-authorization-live-allowed.txt
            ${{ runner.temp }}/firestore-authorization-live-audit.txt
            ${{ runner.temp }}/firestore-authentication-live.json
            ${{ runner.temp }}/firestore-authentication-live-expected.txt
            ${{ runner.temp }}/firestore-authentication-live-allowed.txt
            ${{ runner.temp }}/firestore-authentication-live-audit.txt
            ${{ runner.temp }}/firestore-indexes.json
            ${{ runner.temp }}/firestore-fields.json
            ${{ runner.temp }}/firestore-composite-args.tsv
            ${{ runner.temp }}/firestore-field-args.tsv
          if-no-files-found: warn
          retention-days: 400

      # Delete only the database whose creation this run confirmed; never a
      # pinned database or a candidate whose create returned an error.
      - name: delete the run-owned Firestore database
        if: always() && env.FIRESTORE_LIVE_OWNED != ''
        run: |
          set -euo pipefail
          # No preflight describe: permission/network failures must remain
          # failures, rather than masquerading as an absent database.
          if [ "$FIRESTORE_LIVE_OWNED" != "$FIRESTORE_LIVE_DATABASE_ID" ] ||
             [[ "$FIRESTORE_LIVE_OWNED" != ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-* ]]; then
            echo "ERROR: refusing cleanup without this run's confirmed database ownership"
            exit 1
          fi
          gcloud firestore databases delete \
            --database="$FIRESTORE_LIVE_OWNED" \
            --project="$FIRESTORE_LIVE_PROJECT_ID" \
            --quiet
          echo "deleted the run-owned database $FIRESTORE_LIVE_OWNED"

      # Last, and after the cleanup that needs it: the decoded key does not
      # outlive the job even in the failure paths. The runner VM is destroyed
      # anyway; this is defense in depth, and it is cheap.
      - name: shred the service-account key
        if: always()
        run: |
          key="$RUNNER_TEMP/firestore-sa.json"
          if [ -f "$key" ]; then
            shred -u "$key" 2>/dev/null || rm -f "$key"
            echo "removed $key"
          fi
