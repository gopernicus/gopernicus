# Dependency currency (SOC 2 CC7.1 / CC6.8).
#
# Actions: one grouped PR a month so the full-SHA pins in the workflows stay
# fresh (Dependabot rewrites the SHA and the trailing version comment).
#
# Go modules: the go.work tree has no root go.mod, so every module directory is
# its own update target; each gets one grouped PR a month. Sibling framework
# modules (github.com/gopernicus/gopernicus/...) are IGNORED here on purpose:
# they move only through the release trains in RELEASING.md, never through
# Dependabot and never through `go work sync`.
#
# Security advisories are the `vuln` CI job's business (govulncheck, symbol-level
# reachability); this file only keeps versions moving between trains.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /sdk
      - /pockets
      - /pockets/*
      - /pockets/*/stores/*
      - /pockets/*/views/*
      - /integrations/*/*
      - /examples/*
      - /ui/goth
      - /workshop/gopernicus
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "github.com/gopernicus/gopernicus/*"
